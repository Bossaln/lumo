# Aktivieren (einmal, mit deiner GitHub-Anmeldung – sie braucht das Recht „workflow“):
#   mkdir -p .github/workflows && git mv packaging/github-workflows/*.yml .github/workflows/
#   git commit -m "Workflows aktivieren" && git push
#
# Baut und testet lumo auf einem Mac von GitHub, bei Pull Requests und auf main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Build
        run: swift build
      - name: Test
        # swift test meldet gelegentlich „plugin for module TestingMacros not found“; dann einmal wiederholen.
        run: swift test || swift test
      - name: App bundle
        run: scripts/build-app.sh
